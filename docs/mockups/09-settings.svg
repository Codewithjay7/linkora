<text x="28" y="414" class="t12 tx mono">linkora-a274a.firebasestorage.app</text>

<text x="16" y="442" class="t10 mu">Linkora talks to this Firebase project and nothing</text>
<text x="16" y="456" class="t10 mu">else. It does not use any company server, database,</text>
