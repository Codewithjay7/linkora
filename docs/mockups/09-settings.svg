<!-- BACKEND -->
<text x="16" y="280" class="t11 b mu">BACKEND</text>
<rect x="14" y="290" width="292" height="132" rx="10" fill="#fff" stroke="#0A66C2" stroke-width="1.5"/>
<text x="28" y="310" class="t10 mu">Firebase project</text>
<text x="28" y="326" class="t13 b pri mono">linkora-a274a</text>
