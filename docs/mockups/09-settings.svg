<line x1="28" y1="162" x2="292" y2="162" stroke="#E3E1DD"/>
<text x="28" y="180" class="t10 mu">Email</text>
<text x="28" y="196" class="t13 tx">jordan@example.com</text>
<line x1="28" y1="206" x2="292" y2="206" stroke="#E3E1DD"/>
<text x="28" y="224" class="t10 mu">User ID</text>
