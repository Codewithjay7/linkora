<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" width="320" height="660" role="img" aria-label="Linkora Settings screen mockup showing the Firebase project identification card">
<title>Linkora — Settings, showing the backend identification card (mockup)</title>
<style>
text{font-family:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif}
.t9{font-size:9px}.t10{font-size:10px}.t11{font-size:11px}.t12{font-size:12px}.t13{font-size:13px}.t15{font-size:15px}
.b{font-weight:700}.b8{font-weight:800}.sb{font-weight:600}
.mu{fill:#5E5E5C}.tx{fill:#1D1D1B}.pri{fill:#0A66C2}
.mono{font-family:Consolas,'Courier New',monospace}
</style>
<rect x="0.5" y="0.5" width="319" height="659" rx="22" fill="#F4F2EE" stroke="#D9D6D1"/>
<text x="18" y="24" class="t10 mu sb">9:41</text>
<text x="302" y="24" class="t10 mu" text-anchor="end">▮▮▮ ⌁ ▰</text>

<path d="M1 34 h318 v44 h-318 z" fill="#fff"/>
<line x1="1" y1="78" x2="319" y2="78" stroke="#E3E1DD"/>
<text x="18" y="62" class="t15 pri">‹</text>
<text x="160" y="62" class="t15 b tx" text-anchor="middle">Settings</text>

<!-- ACCOUNT -->
<text x="16" y="106" class="t11 b mu">ACCOUNT</text>
<rect x="14" y="116" width="292" height="132" rx="10" fill="#fff" stroke="#E3E1DD"/>
