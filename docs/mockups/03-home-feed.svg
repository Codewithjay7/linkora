<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" width="320" height="660" role="img" aria-label="Linkora Home feed screen mockup">
<title>Linkora — Home feed (mockup)</title>
<style>
text{font-family:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif}
.t9{font-size:9px}.t10{font-size:10px}.t11{font-size:11px}.t12{font-size:12px}.t13{font-size:13px}.t15{font-size:15px}.t22{font-size:22px}
.b{font-weight:700}.b8{font-weight:800}.sb{font-weight:600}
.mu{fill:#5E5E5C}.tx{fill:#1D1D1B}.pri{fill:#0A66C2}
</style>
<rect x="0.5" y="0.5" width="319" height="659" rx="22" fill="#F4F2EE" stroke="#D9D6D1"/>
<text x="18" y="24" class="t10 mu sb">9:41</text>
<text x="302" y="24" class="t10 mu" text-anchor="end">▮▮▮ ⌁ ▰</text>

<!-- header -->
<path d="M1 34 h318 v46 h-318 z" fill="#fff"/>
<line x1="1" y1="80" x2="319" y2="80" stroke="#E3E1DD"/>
<text x="16" y="64" class="t22 b8 pri">Linkora</text>
<rect x="240" y="45" width="64" height="26" rx="13" fill="#0A66C2"/>
<text x="272" y="62" class="t12 b" fill="#fff" text-anchor="middle">+ Post</text>

<!-- post card 1 -->
<rect x="14" y="92" width="292" height="212" rx="16" fill="#fff" stroke="#E3E1DD"/>
<circle cx="42" cy="122" r="20" fill="#0A66C2"/>
<text x="42" y="129" class="t15 b" fill="#fff" text-anchor="middle">PS</text>
<text x="72" y="116" class="t13 b tx">Priya Sharma</text>
<text x="72" y="130" class="t11 mu">Frontend developer · React Native</text>
<text x="72" y="143" class="t10 mu">2h</text>
<text x="28" y="170" class="t13 tx">Finally shipped the offline-first sync</text>
<text x="28" y="188" class="t13 tx">layer this week. Firestore's local cache</text>
<text x="28" y="206" class="t13 tx">did most of the heavy lifting. 🎉</text>
<text x="28" y="234" class="t10 mu">12 likes</text>
<text x="292" y="234" class="t10 mu" text-anchor="end">4 comments</text>
<line x1="28" y1="248" x2="292" y2="248" stroke="#E3E1DD"/>
<text x="90" y="274" class="t12 b pri" text-anchor="middle">♥  Liked</text>
<text x="230" y="274" class="t12 b mu" text-anchor="middle">💬  Comment</text>

<!-- post card 2 -->
<rect x="14" y="316" width="292" height="242" rx="16" fill="#fff" stroke="#E3E1DD"/>
<circle cx="42" cy="346" r="20" fill="#0A66C2"/>
<text x="42" y="353" class="t15 b" fill="#fff" text-anchor="middle">AK</text>
<text x="72" y="340" class="t13 b tx">Arun Kumar</text>
<text x="72" y="354" class="t11 mu">Backend engineer</text>
<text x="72" y="367" class="t10 mu">5h</text>
<text x="28" y="394" class="t13 tx">Notes from today's session on Firestore</text>
<text x="28" y="412" class="t13 tx">security rules. Deny by default, always.</text>
<rect x="28" y="426" width="264" height="76" rx="10" fill="#E3E1DD"/>
<text x="160" y="470" class="t11 mu" text-anchor="middle">▨  attached image</text>
<text x="28" y="522" class="t10 mu">8 likes</text>
<text x="292" y="522" class="t10 mu" text-anchor="end">1 comment</text>
<line x1="28" y1="534" x2="292" y2="534" stroke="#E3E1DD"/>

<!-- tab bar -->
<path d="M1 604 h318 v34 a22 22 0 0 1 -22 22 h-274 a22 22 0 0 1 -22 -22 z" fill="#fff"/>
<line x1="1" y1="604" x2="319" y2="604" stroke="#E3E1DD"/>
<text x="52" y="628" class="t15" text-anchor="middle">🏠</text>
<text x="52" y="646" class="t9 pri sb" text-anchor="middle">Home</text>
<text x="124" y="628" class="t15" text-anchor="middle">👥</text>
<text x="124" y="646" class="t9 mu" text-anchor="middle">Network</text>
