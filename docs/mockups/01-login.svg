<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" width="320" height="660" role="img" aria-label="Linkora Login screen mockup">
<title>Linkora — Login screen (mockup)</title>
<style>
text{font-family:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif}
.t9{font-size:9px}.t10{font-size:10px}.t11{font-size:11px}.t12{font-size:12px}.t13{font-size:13px}.t15{font-size:15px}.t28{font-size:28px}
.b{font-weight:700}.b8{font-weight:800}.sb{font-weight:600}
.mu{fill:#5E5E5C}.tx{fill:#1D1D1B}.pri{fill:#0A66C2}
</style>
<rect x="0.5" y="0.5" width="319" height="659" rx="22" fill="#F4F2EE" stroke="#D9D6D1"/>
<!-- status bar -->
<text x="18" y="24" class="t10 mu sb">9:41</text>
<text x="302" y="24" class="t10 mu" text-anchor="end">▮▮▮ ⌁ ▰</text>

<!-- brand -->
<text x="160" y="196" class="t28 b8 pri" text-anchor="middle">Linkora</text>
<text x="160" y="216" class="t12 mu" text-anchor="middle">Your personal professional network.</text>

<!-- email -->
<text x="26" y="266" class="t11 sb mu">EMAIL</text>
<rect x="26" y="274" width="268" height="44" rx="10" fill="#fff" stroke="#E3E1DD"/>
<text x="38" y="301" class="t13 mu">you@example.com</text>

<!-- password -->
<text x="26" y="342" class="t11 sb mu">PASSWORD</text>
<rect x="26" y="350" width="268" height="44" rx="10" fill="#fff" stroke="#E3E1DD"/>
<text x="38" y="377" class="t13 mu">Your password</text>

<!-- sign in -->
<rect x="26" y="418" width="268" height="46" rx="23" fill="#0A66C2"/>
<text x="160" y="447" class="t15 b" fill="#fff" text-anchor="middle">Sign in</text>

<text x="160" y="490" class="t12 sb pri" text-anchor="middle">Forgot password?</text>

<line x1="26" y1="516" x2="294" y2="516" stroke="#E3E1DD"/>

<!-- create account -->
<rect x="26" y="538" width="268" height="46" rx="23" fill="none" stroke="#0A66C2" stroke-width="1.5"/>
<text x="160" y="567" class="t15 b pri" text-anchor="middle">Create a new account</text>

<text x="160" y="630" class="t9 mu" text-anchor="middle">MOCKUP — rendered from LoginScreen.tsx styles</text>
</svg>
