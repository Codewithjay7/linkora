<text x="42" y="129" class="t13 b" fill="#fff" text-anchor="middle">AK</text>
<text x="70" y="120" class="t13 tx"><tspan class="b">Arun Kumar</tspan> liked your post</text>
<text x="70" y="136" class="t10 mu">12m</text>
<circle cx="290" cy="123" r="4.5" fill="#0A66C2"/>

<!-- unread 2 -->
<rect x="14" y="162" width="292" height="58" rx="10" fill="#fff" stroke="#0A66C2" stroke-width="1.5"/>
<circle cx="42" cy="191" r="18" fill="#0A66C2"/>
<text x="42" y="197" class="t13 b" fill="#fff" text-anchor="middle">RM</text>
<text x="70" y="188" class="t13 tx"><tspan class="b">Ravi Menon</tspan> wants to connect</text>
<text x="70" y="204" class="t10 mu">1h</text>
<circle cx="290" cy="191" r="4.5" fill="#0A66C2"/>

<!-- read 3 -->
<rect x="14" y="230" width="292" height="58" rx="10" fill="#fff" stroke="#E3E1DD"/>
<circle cx="42" cy="259" r="18" fill="#0A66C2"/>
<text x="42" y="265" class="t13 b" fill="#fff" text-anchor="middle">PS</text>
<text x="70" y="256" class="t13 tx"><tspan class="b">Priya Sharma</tspan> commented on your post</text>
<text x="70" y="272" class="t10 mu">3h</text>

<!-- read 4 -->
<rect x="14" y="298" width="292" height="58" rx="10" fill="#fff" stroke="#E3E1DD"/>
<circle cx="42" cy="327" r="18" fill="#0A66C2"/>
<text x="42" y="333" class="t13 b" fill="#fff" text-anchor="middle">SN</text>
<text x="70" y="324" class="t13 tx"><tspan class="b">Sneha Nair</tspan> accepted your</text>
<text x="70" y="340" class="t13 tx">connection request</text>

<!-- read 5 -->
<rect x="14" y="366" width="292" height="58" rx="10" fill="#fff" stroke="#E3E1DD"/>
<circle cx="42" cy="395" r="18" fill="#0A66C2"/>
