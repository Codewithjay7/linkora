<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" width="320" height="660" role="img" aria-label="Linkora Notifications screen mockup">
<title>Linkora — Notifications (mockup)</title>
<style>
text{font-family:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif}
.t9{font-size:9px}.t10{font-size:10px}.t11{font-size:11px}.t12{font-size:12px}.t13{font-size:13px}.t15{font-size:15px}.t22{font-size:22px}
.b{font-weight:700}.b8{font-weight:800}.sb{font-weight:600}
.mu{fill:#5E5E5C}.tx{fill:#1D1D1B}.pri{fill:#0A66C2}
</style>
<rect x="0.5" y="0.5" width="319" height="659" rx="22" fill="#F4F2EE" stroke="#D9D6D1"/>
<text x="18" y="24" class="t10 mu sb">9:41</text>
<text x="302" y="24" class="t10 mu" text-anchor="end">▮▮▮ ⌁ ▰</text>

<path d="M1 34 h318 v46 h-318 z" fill="#fff"/>
<line x1="1" y1="80" x2="319" y2="80" stroke="#E3E1DD"/>
<text x="16" y="64" class="t22 b8 tx">Notifications</text>
<text x="304" y="62" class="t12 sb pri" text-anchor="end">Mark all read</text>

<!-- unread 1 -->
<rect x="14" y="94" width="292" height="58" rx="10" fill="#fff" stroke="#0A66C2" stroke-width="1.5"/>
