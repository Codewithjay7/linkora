<text x="70" y="392" class="t13 tx"><tspan class="b">Vikram Gupta</tspan> liked your post</text>
<text x="70" y="408" class="t10 mu">2d</text>

<!-- tab bar -->
<path d="M1 604 h318 v34 a22 22 0 0 1 -22 22 h-274 a22 22 0 0 1 -22 -22 z" fill="#fff"/>
<line x1="1" y1="604" x2="319" y2="604" stroke="#E3E1DD"/>
<text x="52" y="628" class="t15" text-anchor="middle">🏠</text>
<text x="52" y="646" class="t9 mu" text-anchor="middle">Home</text>
<text x="124" y="628" class="t15" text-anchor="middle">👥</text>
