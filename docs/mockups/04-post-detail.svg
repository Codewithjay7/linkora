<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" width="320" height="660" role="img" aria-label="Linkora Post detail and comments screen mockup">
<title>Linkora — Post detail and comments (mockup)</title>
<style>
text{font-family:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif}
.t9{font-size:9px}.t10{font-size:10px}.t11{font-size:11px}.t12{font-size:12px}.t13{font-size:13px}.t15{font-size:15px}
.b{font-weight:700}.b8{font-weight:800}.sb{font-weight:600}
.mu{fill:#5E5E5C}.tx{fill:#1D1D1B}.pri{fill:#0A66C2}.dg{fill:#B42318}
</style>
<rect x="0.5" y="0.5" width="319" height="659" rx="22" fill="#F4F2EE" stroke="#D9D6D1"/>
<text x="18" y="24" class="t10 mu sb">9:41</text>
<text x="302" y="24" class="t10 mu" text-anchor="end">▮▮▮ ⌁ ▰</text>

<!-- nav header -->
<path d="M1 34 h318 v44 h-318 z" fill="#fff"/>
<line x1="1" y1="78" x2="319" y2="78" stroke="#E3E1DD"/>
<text x="18" y="62" class="t15 pri">‹</text>
<text x="160" y="62" class="t15 b tx" text-anchor="middle">Post</text>

<!-- post block -->
<rect x="14" y="90" width="292" height="132" rx="16" fill="#fff" stroke="#E3E1DD"/>
<circle cx="40" cy="118" r="18" fill="#0A66C2"/>
<text x="40" y="124" class="t13 b" fill="#fff" text-anchor="middle">PS</text>
<text x="68" y="114" class="t13 b tx">Priya Sharma</text>
<text x="68" y="128" class="t10 mu">2h</text>
<text x="28" y="158" class="t13 tx">Finally shipped the offline-first sync</text>
<text x="28" y="176" class="t13 tx">layer this week. Firestore's local cache</text>
<text x="28" y="194" class="t13 tx">did most of the heavy lifting. 🎉</text>

<text x="16" y="252" class="t11 b mu">COMMENTS (2)</text>

<!-- comment 1 -->
<circle cx="30" cy="286" r="17" fill="#0A66C2"/>
<text x="30" y="292" class="t12 b" fill="#fff" text-anchor="middle">AK</text>
<rect x="56" y="266" width="250" height="76" rx="10" fill="#fff" stroke="#E3E1DD"/>
<text x="68" y="286" class="t12 b tx">Arun Kumar</text>
<text x="68" y="304" class="t13 tx">Nice work. Did the queued writes</text>
<text x="68" y="320" class="t13 tx">replay cleanly on reconnect?</text>
<text x="68" y="336" class="t10 mu">1h</text>

<!-- comment 2 -->
<circle cx="30" cy="376" r="17" fill="#0A66C2"/>
<text x="30" y="382" class="t12 b" fill="#fff" text-anchor="middle">PS</text>
<rect x="56" y="356" width="250" height="76" rx="10" fill="#fff" stroke="#E3E1DD"/>
<text x="68" y="376" class="t12 b tx">Priya Sharma</text>
<text x="68" y="394" class="t13 tx">They did — Firestore handles the</text>
<text x="68" y="410" class="t13 tx">replay itself, nothing custom.</text>
<text x="68" y="426" class="t10 mu">40m</text>
<text x="294" y="426" class="t10 b dg" text-anchor="end">Delete</text>

<!-- composer -->
<path d="M1 590 h318 v48 a22 22 0 0 1 -22 22 h-274 a22 22 0 0 1 -22 -22 z" fill="#fff"/>
<line x1="1" y1="590" x2="319" y2="590" stroke="#E3E1DD"/>
<rect x="14" y="602" width="216" height="36" rx="10" fill="#F4F2EE"/>
<text x="26" y="625" class="t13 mu">Write a comment…</text>
<rect x="238" y="602" width="68" height="36" rx="18" fill="#0A66C2"/>
<text x="272" y="625" class="t12 b" fill="#fff" text-anchor="middle">Send</text>
</svg>
